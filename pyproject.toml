[project]
name = "retail-dwh"
version = "0.1.0"
description = "Retail sales warehouse: Kaggle -> ClickHouse -> dbt, orchestrated by Airflow"
requires-python = "==3.11.*"
dependencies = [
    "clickhouse-connect==1.9.0",
    "kaggle==2.2.4",
    "pandas==2.1.4",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==8.3.4",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
typeCheckingMode = "standard"  # strict flags every untyped pandas call
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
